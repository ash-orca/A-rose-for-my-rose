<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Rose For You</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #07060a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const MESSAGE = "i \u2665 baby ";   // <- change this text
const SPEED = 0.45, TILT = 0.45;
const RAMP = ".:-~+=ilI!1tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- 3D rose ----------
const pts = [];
for (let i = 0; i < 5200; i++) {
  const th = (i / 5200) * 20 * Math.PI;
  const phi = (Math.PI / 2) * Math.exp(-th / (8 * Math.PI));
  const m = (3.6 * th) % (2 * Math.PI);
  const f = 1 - 0.5 * Math.pow(1.25 * Math.pow(1 - m / Math.PI, 2) - 0.25, 2);
  for (let j = 0; j <= 11; j++) {
    const xx = f * (0.3 + 0.7 * j / 11);
    const y = 1.995653 * xx * xx * Math.pow(1.27689 * xx - 1, 2) * Math.sin(phi);
    const r = xx * (xx * Math.sin(phi) + y * Math.cos(phi));
    // p[4]: 0..1 shade (inner petals darker, rims lighter)
    pts.push([r * Math.sin(th), r * Math.cos(th), xx * (xx * Math.cos(phi) - y * Math.sin(phi)), 0, xx * (0.6 + 0.4 * (m / (2 * Math.PI)))]);
  }
}
// calyx (small green cup under the bloom)
for (let i = 0; i <= 14; i++) for (let k = 0; k < 24; k++) {
  const t = i / 14, a = (k / 24) * 2 * Math.PI, rad = 0.05 + 0.22 * Math.sin(Math.PI * (0.15 + 0.7 * t));
  pts.push([rad * Math.cos(a), rad * Math.sin(a), 0.02 - 0.3 * t, 1, 0.75]);
}
// stem
for (let i = 0; i <= 280; i++) {
  const t = i / 280, z = -0.3 - t * 2.15, cx = 0.12 * Math.sin(t * 2.2);
  for (let k = 0; k < 7; k++) {
    const a = (k / 7) * 2 * Math.PI;
    pts.push([cx + 0.04 * Math.cos(a), 0.04 * Math.sin(a), z, 1, 0.55 + 0.45 * Math.cos(a)]);
  }
}
// leaves
function leaf(z0, ang, len) {
  const cx = 0.12 * Math.sin(((-z0 - 0.3) / 2.15) * 2.2);
  for (let i = 0; i <= 44; i++) for (let j = -9; j <= 9; j++) {
    const u = i / 44, v = j / 9, w = 0.21 * Math.sin(Math.PI * u) * v, d = len * u;
    pts.push([cx + Math.cos(ang) * d - Math.sin(ang) * w, Math.sin(ang) * d + Math.cos(ang) * w,
      z0 + 0.5 * Math.sin(u * 1.6) - 0.14 * Math.abs(v) * u, 1, 0.5 + 0.5 * (1 - Math.abs(v))]);
  }
}
leaf(-1.25, 0.5, 0.8); leaf(-1.8, 0.5 + Math.PI, 0.72);

// ---------- background bits ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), p: rnd(0, 6.28), s: rnd(0.4, 1.2), c: Math.random() < 0.3 ? "+" : "." }));
const petals = Array.from({ length: 16 }, () => ({ x: Math.random(), y: Math.random(), v: rnd(0.012, 0.03), p: rnd(0, 6.28), c: ",~o'".charAt(Math.random() * 4 | 0) }));

let W, H, cols, rows, cw, ch, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ch = Math.max(7, Math.min(13, Math.floor(H / 90)));
  ctx.font = `bold ${ch}px "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace`;
  cw = ctx.measureText('M').width;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
}
addEventListener('resize', resize); resize();

let last = performance.now(), ang = 0, T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  ang += SPEED * dt;
  const tilt = TILT + 0.06 * Math.sin(T * 0.6);          // gentle breathing
  const ca = Math.cos(ang), sa = Math.sin(ang), ct = Math.cos(tilt), st = Math.sin(tilt);
  const scale = Math.min(H / 3.9, W / 2.6);
  const ox = W / 2, oy = H / 2 + scale * 0.5;

  // background: soft rose glow
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#07060a'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, Math.max(W, H) * 0.6);
  g.addColorStop(0, 'rgba(120,20,50,0.28)'); g.addColorStop(1, 'rgba(7,6,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = `${ch}px "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace`;
  for (const s of stars) {                                   // twinkling dots
    ctx.globalAlpha = 0.08 + 0.22 * (0.5 + 0.5 * Math.sin(T * s.s + s.p));
    ctx.fillStyle = '#f2c9d6'; ctx.fillText(s.c, s.x * W, s.y * H);
  }
  for (const p of petals) {                                  // drifting petals
    p.y += p.v * dt; if (p.y > 1.05) { p.y = -0.05; p.x = Math.random(); }
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#d0506e';
    ctx.fillText(p.c, (p.x + 0.03 * Math.sin(T * 0.7 + p.p)) * W, p.y * H);
  }
  ctx.globalAlpha = 1;
  ctx.font = `bold ${ch}px "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace`;

  // rose
  const zb = new Float32Array(cols * rows).fill(1e9), cell = new Array(cols * rows);
  for (let n = 0; n < pts.length; n++) {
    const p = pts[n];
    const x1 = p[0] * ca - p[1] * sa, y1 = p[0] * sa + p[1] * ca;
    const up = p[2] * ct + y1 * st, depth = y1 * ct - p[2] * st;
    const c = Math.floor((ox + x1 * scale) / cw), r = Math.floor((oy - up * scale) / ch);
    if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
    const idx = r * cols + c;
    if (depth < zb[idx]) { zb[idx] = depth; cell[idx] = [depth, p[3], p[4]]; }
  }
  for (let i = 0; i < cell.length; i++) {
    const e = cell[i]; if (!e) continue;
    let b = Math.max(0, Math.min(1, 0.5 - e[0] / 2.6)) * (0.5 + 0.5 * e[2]);
    b = Math.max(0.1, Math.min(1, b * 1.3));
    const chr = RAMP[Math.min(RAMP.length - 1, Math.floor(b * RAMP.length))];
    ctx.fillStyle = e[1] === 0
      ? `rgb(${70 + 185 * b | 0},${6 + 55 * b * b | 0},${25 + 55 * b | 0})`
      : `rgb(${15 + 40 * b | 0},${55 + 165 * b | 0},${25 + 50 * b | 0})`;
    ctx.fillText(chr, (i % cols) * cw, Math.floor(i / cols) * ch);
  }

  // message fades in
  ctx.globalAlpha = Math.min(0.75, Math.max(0, (T - 1.5) / 3));
  ctx.fillStyle = '#e8a9ba'; ctx.textAlign = 'center';
  ctx.font = `italic ${Math.round(ch * 1.6)}px Georgia, "Times New Roman", serif`;
  ctx.fillText(MESSAGE, W / 2, H - ch * 4);
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
